[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notifig"
version = "0.1.0"
description = "Reactive typed configuration for Pydantic: a config tree that tells you what changed."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Francisco"}
]
requires-python = ">=3.13"
dependencies = [
    # The floors are a support policy, not an empirical claim: the full suite
    #  bisects clean down to pydantic 2.0.3 (with any pydantic-settings), and
    #  pydantic-settings itself breaks below 2.10.0 (`cli_shortcuts` and the
    #  ConfigDict-driven CLI customization landed there). What the range
    #  declares is what the CI matrix answers bugs for - roughly the last two
    #  years of pydantic 2.x - and the matrix tests BOTH ends of every range
    #  (see .github/workflows/ci.yml). The ceiling is a major we owe nothing
    #  to. Notifig leans on pydantic internals on purpose - the generic
    #  metadata that binds a config model to its declarer, `__pydantic_extra__`
    #  typed so dynamic entries instantiate eagerly, `validate_assignment`
    #  stamping entry names - so a minor cannot be trusted blind either;
    #  tests/test_pydantic_invariants.py is the upgrade gate, its tier labels
    #  say how to react.
    "pydantic>=2.10,<3",
    # Direct dependency: `sources.py` builds on pydantic-settings' source
    #  machinery (`PydanticBaseSettingsSource`), and the CLI parsing contract
    #  (`CliSettingsSource`, `cli_shortcuts`, `cli_implicit_flags`) is its API
    #  too. Same floor/ceiling rule as pydantic.
    "pydantic-settings>=2.10.0,<3",
    # File sources (`sources.py`) load and merge through anyconfig. The surface
    #  used is two functions and a merge strategy constant, stable across its
    #  history (the suite passes against 0.14.x as well) - a floor, no ceiling.
    "anyconfig>=0.15.1",
    # Readers for the file extensions `FILE_EXTENSIONS` names. anyconfig can
    #  import its own parsers, but a clean install must be able to read every
    #  format the library claims, so the parsers are direct dependencies.
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
# TODO: docs URL once it exists.

[tool.setuptools.packages.find]
include = ["notifig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]  # E501: line too long

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

# TODO: [tool.importlinter] - the layering contracts belong in this repo once
#  the package grows internal layering worth enforcing ("never imports anything
#  app-shaped" is the spirit of the one this repo was born with).
