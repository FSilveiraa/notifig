name: Release

# CD: a tag `v*` builds the distribution, proves the sdist stands alone
#  (install into a bare venv, run the suite against the INSTALLED package),
#  and publishes to PyPI via trusted publishing - no token in the repo.
#  One-time setup on PyPI: add a pending publisher for
#  FSilveiraa/notifig, workflow "release", environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # pyproject.toml is the single source of truth for the version; the tag
      #  only presses the button. A tag that disagrees with the declared
      #  version is a mistake, and publishing one would ship a version number
      #  nobody declared.
      - name: The tag matches the declared version
        run: |
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          pushed="${GITHUB_REF_NAME#v}"
          if [ "$pushed" != "$declared" ]; then
            echo "tag v$pushed does not match pyproject version $declared"
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-the-sdist:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The published artifact must work without the repo: install the sdist
      #  alone, run the suite against the installed package from a copy of
      #  the tests (the tests are not part of the wheel).
      - run: pip install dist/*.tar.gz pytest
      - run: cp -r tests /tmp/tests && cd /tmp && python -m pytest tests -q

  publish:
    runs-on: ubuntu-latest
    needs: smoke-the-sdist
    environment: pypi
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
