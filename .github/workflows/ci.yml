name: CI

on:
  push:
    branches: [main]
  pull_request:

# The rule, as one sentence: the LATEST dependency set runs on every supported
# Python; the FLOOR dependency set runs on the Python floor. A new Python can
# only ever run dependency versions that shipped wheels for it, so old deps on
# a new Python is a combination that cannot exist - and the floor's job is to
# prove the ranges still work on the oldest supported setup, not every setup.
# Adding a Python version is one entry in the list; the rule re-applies itself.
jobs:
  check:
    runs-on: ubuntu-latest
    name: py${{ matrix.python-version }} / ${{ matrix.deps }} deps
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        deps: ["latest"]
        include:
          - deps: "floor"
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The floor leg pins every ranged dependency to the oldest version the
      #  ranges claim to support (constraints/floor.txt); the latest leg
      #  installs whatever PyPI serves today. If the suite fails on only one
      #  leg, a range is lying - widen the code or narrow the range.
      - run: pip install -e . pytest ruff mypy -c constraints/floor.txt
        if: matrix.deps == 'floor'
      - run: pip install -e . pytest ruff mypy
        if: matrix.deps == 'latest'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy notifig/
      - run: pytest tests/ -q
