name: CI

on:
  push:
    branches: [main]
  pull_request:

# Three jobs, three postures:
#
# - floor:       the oldest Python supported + the oldest dependency versions
#                the ranges claim (constraints/floor.txt). Proves the ranges
#                are honest. Named - changing it is a support decision.
# - recommended: the Python this project tells users to run, with today's
#                dependencies. What `pip install notifig` gives a user today.
#                Named - changing it is a recommendation, made on purpose.
# - rolling:     python "3.x" resolves to the newest stable 3.x at run time,
#                so this job chases Python's future and the latest
#                dependencies with zero maintenance. It is the early warning:
#                when a new Python or dependency breaks the library, this job
#                turns red before anyone promised them. Until the next Python
#                ships, it duplicates the recommended job on purpose.
#
# The justfile is the single source of truth for what these steps run - each
# step invokes a recipe, so changing a recipe changes CI without editing this
# file (run `just --list` locally to see them).
jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.posture }} (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - posture: floor
            python-version: "3.13"
            constraints: "-c tests/version_floors.txt"
          - posture: recommended
            python-version: "3.14"
            constraints: ""
          - posture: rolling
            python-version: "3.x"
            constraints: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@v2
      - run: pip install -e .[dev] ${{ matrix.constraints }}
      - run: just ci
